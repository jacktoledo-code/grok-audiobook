services:
  - type: web
    name: grok-audiobook
    runtime: docker
    repo: https://github.com/jacktoledo-code/grok-audiobook
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: GROK_TTS_URL
        value: https://api.x.ai/v1/tts
      - key: ALLOWED_ORIGINS
        value: ""
      - key: MAX_UPLOAD_MB
        value: "10"
